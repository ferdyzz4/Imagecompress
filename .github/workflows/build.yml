name: Build Windows EXE and macOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --onefile --windowed --name ImageCompressor --collect-all ttkbootstrap main.py

      - name: Build App (macOS)
        if: matrix.os == 'macos-latest'
        run: pyinstaller --windowed --name ImageCompressor --collect-all ttkbootstrap main.py

      - name: Zip App bundle (macOS)
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --sequesterRsrc --keepParent dist/ImageCompressor.app dist/ImageCompressor-macOS.zip

      - name: Upload EXE artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ImageCompressor-windows
          path: dist/ImageCompressor.exe

      - name: Upload App artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ImageCompressor-macos
          path: dist/ImageCompressor-macOS.zip
